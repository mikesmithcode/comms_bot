[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comms-bot"
version = "0.1.0"
description = "Standalone asynchronous Telegram integration package for agent loops, command management, and lab log sharing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioconsole>=0.9.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/comms_bot"]
